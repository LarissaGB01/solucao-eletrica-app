# Fresh launch, then wait for the home screen.
# On the CI emulator, Android sometimes finishes removing the cleared task after the new process
# has started and kills it ("Destroy timeout of remove-task"), leaving the launch screen with no
# app behind it. Waiting longer never helps there, so relaunch instead.
appId: com.larissagb.solucaoeletrica
---
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          clearState: true
      - extendedWaitUntil:
          visible: 'Base Teórica'
          timeout: 30000
